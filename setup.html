<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MusicVault</title>

<link rel="stylesheet"
href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

</head>

<body>

<div class="setup-wrapper">

    <div class="setup-card">
        <div class="setup-logo">

        🎵

        </div>
        <h1>

            MusicVault

        </h1>

        <p class="setup-subtitle">

            Create account or login

        </p>

        <form id="authForm">

            <input
            type="text"
            id="username"
            placeholder="Username"
            required>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <button
            type="submit"
            id="submitBtn">

                Sign Up

            </button>

        </form>

        <button
        id="toggleMode"
        class="secondary-btn">

            Already have account?
            Login

        </button>

    </div>

</div>

<script type="module"
src="js/setup.js"></script>

</body>

</html>
