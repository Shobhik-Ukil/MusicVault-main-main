<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicVault</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-record-vinyl"></i>

            <span>MusicVault</span>

        </div>

        <nav>

            <a href="index.html" class="active">
                <i class="fa-solid fa-house"></i>
                Home
            </a>

            <a href="review.html">
                <i class="fa-solid fa-plus"></i>
                Add Review
            </a>

            <a id="profileLink" href="profile.html">

                <i class="fa-solid fa-user"></i>

                 <span id="profileText">

                    Profile

                </span>

            </a>
            <button id="logoutBtn" class="logout-btn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>
        </nav>

        <div class="sidebar-bottom">

            <h3>Community</h3>

            <p>
                Review albums and discover
                what everyone is listening to.
            </p>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main-content">

        <div class="hero">

            <h1>
                Music Review Database
            </h1>

            <p>
                Share ratings, discover albums,
                and see what your friends think.
            </p>

        </div>

        <!-- STATS -->

        <section class="stats">

            <div class="stat-card">

                <h3 id="totalReviews">
                    0
                </h3>

                <p>
                    Reviews
                </p>

            </div>

            <div class="stat-card">

                <h3 id="totalUsers">
                    0
                </h3>

                <p>
                    Reviewers
                </p>

            </div>

            <div class="stat-card">

                <h3 id="totalAlbums">
                    0
                </h3>

                <p>
                    Albums
                </p>

            </div>

        </section>

        <!-- FILTERS -->

        <section class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search albums...">

            <select id="artistFilter">

                <option value="">
                    All Artists
                </option>

            </select>

            <select id="genreFilter">

                <option value="">
                    All Genres
                </option>

            </select>

            <select id="reviewerFilter">

                <option value="">
                    All Reviewers
                </option>

            </select>

            <select id="ratingFilter">

                <option value="">
                    All Ratings
                </option>

                <option value="90">
                    90-100
                </option>

                <option value="80">
                    80-89
                </option>

                <option value="70">
                    70-79
                </option>

                <option value="60">
                    60-69
                </option>

                <option value="0">
                    Below 60
                </option>

            </select>

        </section>

        <!-- REVIEWS -->

        <section
            id="reviewsContainer"
            class="reviews-grid">

        </section>

    </main>

</div>

<script type="module" src="js/home.js"></script>

</body>
</html>
